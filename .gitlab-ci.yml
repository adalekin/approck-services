---
variables:
  IMAGE_PYTHON: python:3-bookworm

stages:
  - pypi-release

.snippets:
  install-poetry:
    - curl -sSL https://install.python-poetry.org | python3 -
    - export PATH="/root/.local/bin:$PATH"
    - poetry --version
    - poetry install

pypi-release:
  image: $IMAGE_PYTHON
  stage: pypi-release
  before_script:
    - if [ -z "$POETRY_PYPI_TOKEN_PYPI" ]; then echo "POETRY_PYPI_TOKEN_PYPI is empty!" && exit 1; fi
    - !reference [.snippets, install-poetry]
  script:
    - poetry build
    - poetry publish
  rules:
    - if: $CI_COMMIT_TAG
