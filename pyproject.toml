[project]
name = "approck-services"
version = "1.1.0"
description = "Async SQLAlchemy and FastAPI service helpers, with optional S3-compatible uploads."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Aleksey Dalekin", email = "adalekin@gmail.com" }]
requires-python = ">=3.10"
keywords = ["async", "fastapi", "sqlalchemy", "service-layer", "s3", "aioboto3"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "multimethod>=1.11,<2",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.111.0"]
sqlalchemy = [
    "approck-sqlalchemy-utils[postgres]>=0.1.0",
    "pydantic>=2.0",
]
upload = ["aioboto3>=11.0.0"]

[project.urls]
Homepage = "https://github.com/adalekin/approck-services"
Repository = "https://github.com/adalekin/approck-services"
Issues = "https://github.com/adalekin/approck-services/issues"
Changelog = "https://github.com/adalekin/approck-services/releases"

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    "mypy>=1.10.0,<3",
    "pre-commit>=3.1.0",
    "pytest>=8.2.2,<9",
    "pytest-asyncio>=1.4.0,<2",
    "ruff>=0.4.7",
]

[tool.hatch.build.targets.wheel]
packages = ["approck_services"]

[tool.hatch.build.targets.sdist]
only-include = ["approck_services", "README.md", "LICENSE", "pyproject.toml"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
show_error_codes = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "approck_services.sqlalchemy.base",
    "approck_services.fastapi",
]
disable_error_code = ["no-redef", "misc", "attr-defined"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
