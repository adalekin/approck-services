name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --all-extras --group dev --python ${{ matrix.python-version }} --frozen

      - name: Ruff (lint)
        run: uv run --python ${{ matrix.python-version }} ruff check .

      - name: Ruff (format)
        run: uv run --python ${{ matrix.python-version }} ruff format --check .

      - name: Mypy
        run: uv run --python ${{ matrix.python-version }} mypy approck_services

      - name: Pytest
        run: uv run --python ${{ matrix.python-version }} pytest
